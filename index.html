<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Xgrid Globe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom right, #0f0f0f, #1a1a1a);
        }

        #globeViz {
            width: 100vw;
            height: 100vh;
            display: none;
        }

        #splash {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #100006 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 250px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 9999;
            text-shadow: 2px 2px 0 #7b08b6, 4px 4px 0 #f4f4f4, 6px 6px 0 #36ff09;
        }

        .footprint-svg, .xgrid-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: none;
            z-index: 0;
        }

        .footprint-svg {
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 2;
            animation: fadeInScale 3s ease-out forwards;
        }

        .footprint-svg text {
            font-size: 160px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawText 3s ease forwards;
        }

        .xgrid-svg {
            stroke: #e91e63;
            stroke-width: 3;
            z-index: 1;
        }

        .xgrid-svg text {
            font-size: 100px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawXgrid 2s ease-out 0.5s forwards, gravityFloat 4s ease-in-out infinite;
        }

        @keyframes drawText {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes drawXgrid {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gravityFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(1deg); }
            75% { transform: translateY(10px) rotate(-1deg); }
        }

        #locationList {
            position: fixed;
            bottom: 0;
            left: 50%;
            right: 50%;
            width: 50%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        #locationList ul {
            display: flex;
            width: 100%;
            justify-content: space-evenly;
            margin: 0;
            padding: 0;
            list-style: none;
            flex-wrap: wrap;
        }

        #locationList li {
            flex: 1;
            text-align: center;
            padding: 30px;
            background-color: #0b404c4a;
            border-radius: 0;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease-in-out;
        }

        .btn-exp {
            position: absolute;
            bottom: 80px;
            padding: 20px 40px;
            font-size: 24px;
            background: #07070700;
            color: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            z-index: 10000;
            border: 2px dashed #e91e6333;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            font-family: monospace;
        }

        .btn-exp:hover {
            background: #e91e6329;
            box-shadow: 2px 12px 217px #e51d66;
            color: rgb(255, 255, 255);
        }

        #locationList li:hover {
            background-color: #144259;
            transform: translateY(-10px);
            box-shadow: 0px 8px 32px #141414;
        }

        .location-name {
            white-space: nowrap;
        }

        #audioCanvas {
            position: absolute;
            left: 0;
            z-index: 9998;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            bottom: 0;
            opacity: .1;
        }
    </style>
</head>
<body>

<div id="splash">
    <svg viewBox="0 0 1600 400" class="footprint-svg">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">
            Global Footprint
        </text>
    </svg>

    <svg viewBox="0 0 800 200" class="xgrid-svg">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">
            Xgrid
        </text>
    </svg>

    <button id="startBtn" class="btn-exp">
        Enter Experience
    </button>
    <canvas id="audioCanvas"></canvas>
</div>

<div id="globeViz"></div>
<div id="locationList"><ul></ul></div>

<audio id="splashInSound" src="./drop.mp3" preload="auto"></audio>
<audio id="splashIntro" src="./intro.mp3" preload="auto"></audio>

<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>

<script>
    let globe;
    const LOCATIONS = [
        { lat: 24.8607, lng: 67.0011, size: 0.03, label: 'Karachi' },
        { lat: 33.6844, lng: 73.0479, size: 0.03, label: 'Islamabad' },
        { lat: 31.5204, lng: 74.3587, size: 0.03, label: 'Lahore' },
        { lat: 34.0522, lng: -118.2437, size: 0.03, label: 'California' },
        { lat: 49.4521, lng: 11.0767, size: 0.03, label: 'Nuremberg' },
    ];

    function playSound(id) {
        const sound = document.getElementById(id);
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Sound play error:", e));
        }
    }

    function initGlobe() {
        globe = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png')
            .pointsData(LOCATIONS)
            .pointLat(d => d.lat)
            .pointLng(d => d.lng)
            .pointAltitude(d => 0)
            .pointColor(() => '#8d13ef')
            .labelsData(LOCATIONS)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.label)
            .labelSize(() => 0.5)
            .labelDotRadius(() => 0.9)
            .labelColor(() => 'white');

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.2;

        globe.pointOfView({ lat: 33.6844, lng: 73.0479, altitude: 1 }, 0);
        setTimeout(() => {
            globe.pointOfView({ lat: 33.6844, lng: 73.0479, altitude: 2.4 }, 2000);
        }, 1000);
    }

    function createLocationList() {
        const ul = document.querySelector('#locationList ul');
        LOCATIONS.forEach(loc => {
            const li = document.createElement('li');
            const marker = document.createElement('div');
            marker.className = 'marker';
            const name = document.createElement('span');
            name.className = 'location-name';
            name.textContent = loc.label;
            li.appendChild(marker);
            li.appendChild(name);
            li.onclick = () => {
                globe.pointOfView({ lat: loc.lat, lng: loc.lng, altitude: 0.4 }, 1000);
                playSound('splashInSound');
            };
            ul.appendChild(li);
        });
    }

    const canvas = document.getElementById("audioCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let audioCtx, analyser, sourceNode, bufferLength, dataArray;

    function setupAudioVisualizer(audioElement) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        drawSpectrum();
    }

    function drawSpectrum() {
        requestAnimationFrame(drawSpectrum);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
            barHeight = dataArray[i] * 3;
            ctx.fillStyle = `rgb(${barHeight + 100}, 20, 150)`;
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const introAudio = document.getElementById('splashIntro');
        introAudio.currentTime = 0;
        introAudio.play().catch(e => console.log("Audio error:", e));
        setupAudioVisualizer(introAudio);
        playSound('splashInSound');

        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('globeViz').style.display = 'block';
            initGlobe();
        }, 2500);

        setTimeout(() => {
            createLocationList();
        }, 4000);

        introAudio.onended = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
    });
</script>
</body>
</html>
